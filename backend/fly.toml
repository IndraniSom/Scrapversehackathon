primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  BIDRADAR_HOST = "0.0.0.0"
  BIDRADAR_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
