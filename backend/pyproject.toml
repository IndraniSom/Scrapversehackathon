[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Skythrill256", email = "anjishnuganguly773@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openai==3.3.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pypdf==6.16.1",
    "python-docx==1.2.0",
    "sentence-transformers==6.0.0",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Keep backend lint focused on correctness (E/F) and allow intentional
# broad-except / cleanup patterns in pipeline/OCR and test scaffolding.
ignore = ["BLE001", "S110", "FURB162", "F841", "SIM103", "SIM117", "SIM222", "C408"]
