name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { python-version: "3.13" }
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check src tests scripts
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run pip-audit
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.30.1 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Verify committed Convex generated types
        run: test -f convex/_generated/api.d.ts && test -f convex/_generated/dataModel.d.ts
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm audit --audit-level high
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
        env:
          BIDRADAR_E2E_MODE: "1"
          NEXT_PUBLIC_BIDRADAR_E2E_MODE: "1"
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm exec playwright test
        working-directory: frontend
        env:
          BIDRADAR_E2E_MODE: "1"
          NEXT_PUBLIC_BIDRADAR_E2E_MODE: "1"
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.30.1 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - uses: astral-sh/setup-uv@v10
        with: { python-version: "3.13" }
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: secret scan (no echo)
        run: uv run --project backend python tools/check_sensitive_patterns.py
      - name: SAST ruff + eslint
        run: |
          uv run --project backend ruff check backend/src backend/tests backend/scripts --output-format=github
          pnpm --dir frontend exec eslint . --max-warnings=0
      - name: file length gate
        run: uv run --project backend python tools/check_code_file_lengths.py
      - name: IaC/container scan (checkov + trivy)
        run: |
          pip install checkov==3.3.13
          checkov --directory . --framework dockerfile,github_actions --quiet
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.74.0
          trivy config --severity HIGH,CRITICAL --exit-code 1 .
          trivy fs --severity HIGH,CRITICAL --exit-code 1 .
