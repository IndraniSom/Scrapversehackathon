# Deploy — staged with smoke and automatic rollback
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [preview, staging, production]

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  ci-gate:
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    needs: ci-gate
    if: github.ref == 'refs/heads/main' || inputs.environment != 'production'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.bidradar.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Convex staging
        run: npx convex deploy --prod --preview-name staging
        working-directory: frontend
        env: { CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_STAGING }} }
      - name: Build and push FastAPI image
        run: |
          docker build -t ghcr.io/bidradar/api:${{ github.sha }} -f backend/Dockerfile backend
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/bidradar/api:${{ github.sha }}
      - name: Deploy FastAPI staging
        run: flyctl deploy --image ghcr.io/bidradar/api:${{ github.sha }} --config fly.staging.toml
        env: { FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }} }
      - name: Deploy Next.js staging
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --scope bidradar
        working-directory: frontend
      - name: Smoke staging
        run: |
          curl -fsS https://staging.bidradar.example.com/health/ready
          uv run python tools/smoke_demo.py --mode normal --base-url https://staging.bidradar.example.com
      - name: Rollback staging on failure
        if: failure()
        run: |
          npx vercel rollback --token ${{ secrets.VERCEL_TOKEN }}
          flyctl deploy --image ghcr.io/bidradar/api:previous --config fly.staging.toml

  deploy-production:
    needs: deploy-staging
    if: inputs.environment == 'production' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bidradar.example.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Convex production
        run: npx convex deploy --prod
        working-directory: frontend
        env: { CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }} }
      - name: Deploy FastAPI production
        run: flyctl deploy --image ghcr.io/bidradar/api:${{ github.sha }} --config fly.toml
        env: { FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }} }
      - name: Deploy Next.js production
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --scope bidradar
        working-directory: frontend
      - name: Smoke production
        run: |
          curl -fsS https://bidradar.example.com/health/ready
          curl -fsS https://bidradar.example.com/api/v1/opportunities | grep -q "opportunities"
      - name: Rollback production on failure
        if: failure()
        run: |
          npx vercel rollback --token ${{ secrets.VERCEL_TOKEN }}
          flyctl deploy --image ghcr.io/bidradar/api:previous --config fly.toml
      - name: Alert on failure
        if: failure()
        run: echo "ALERT: production deploy failed, rollback triggered" | tee -a deploy.log
